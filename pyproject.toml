[project]
name = "qubit-calibration-sim"
version = "0.1.0"
description = "Simulated single-transmon bring-up mirroring Quantum Machines' QUAlibrate calibration nodes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "matplotlib",
    "plotly",
    "pillow",
    "lmfit",
    "qutip>=5",
    # export_qua uses qm internals (_dict_to_pb_converter, _print_config); tested on 1.4.x only.
    # qua/trace.py walks Program.qua_program (protobuf schema in qm/grpc/qm/pb/inc_qua_pb2.py) and resultAnalysis.model;
    # tested on 1.4.1 only (tests/test_qua_trace.py::test_qm_qua_surface_is_pinned).
    "qm-qua>=1.4.1,<1.5",
    "qualibration-libs @ git+https://github.com/qua-platform/qualibration-libs.git",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running tests, deselected by default (run with -m \"slow or not slow\")"]
addopts = "-m 'not slow'"
